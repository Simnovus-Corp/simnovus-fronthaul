# Open5GS AMF for the 1-cell example (validated with Open5GS 2.8.0; the other Open5GS files stay at their package defaults).
# Same host as the gNB: keep 127.0.0.5. Core on another machine: set ngap address to that machine's IP (the gNB's <AMF_N2_IP>).
logger:
  file:
    path: /var/log/open5gs/amf.log
global:
  max:
    ue: 1024
amf:
  sbi:
    server:
      - address: 127.0.0.5
        port: 7777
    client:
      scp:
        - uri: http://127.0.0.200:7777
  ngap:
    server:
      - address: 127.0.0.5          # CHANGE if the gNB is on another machine
  metrics:
    server:
      - address: 127.0.0.5
        port: 9090
  guami:
    - plmn_id:
        mcc: "001"                  # MATCH gNB plmn "00101" and the SIM IMSIs
        mnc: "01"
      amf_id:
        region: 2
        set: 1
  tai:
    - plmn_id:
        mcc: "001"
        mnc: "01"
      tac: 1                        # MATCH gNB tac
  plmn_support:
    - plmn_id:
        mcc: "001"
        mnc: "01"
      s_nssai:
        - sst: 1
  security:
    integrity_order: [ NIA2, NIA1, NIA0 ]
    ciphering_order: [ NEA0, NEA1, NEA2 ]
  network_name:
    full: Open5GS
    short: Next
  amf_name: open5gs-amf0
  time:
    t3512:
      value: 540
